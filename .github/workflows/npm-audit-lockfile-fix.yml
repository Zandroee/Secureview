name: Temporary npm audit lockfile remediation

on:
  push:
    branches:
      - security/npm-audit-lockfile-fix

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out security-fix branch
        uses: actions/checkout@v4
        with:
          ref: security/npm-audit-lockfile-fix
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply compatible npm security fixes
        run: npm audit fix

      - name: Confirm audit is clean
        run: npm audit

      - name: Verify Vite production build
        run: npm run build

      - name: Commit updated npm lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package manifest or lockfile changes were generated."
            exit 0
          fi
          git diff --stat -- package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: patch npm audit vulnerabilities"
          git push origin HEAD:security/npm-audit-lockfile-fix
