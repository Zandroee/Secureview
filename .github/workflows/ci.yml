name: CI

on:
  push:
    branches:
      - dev
      - feature/google-maps-service-locations
      - feature/scheduling-reschedule-warranty
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Run Laravel feature and unit tests
        run: php artisan test

      - name: Upload production Vite assets for Hostinger
        if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: secureview-hostinger-vite-${{ github.sha }}
          path: public/build/
          if-no-files-found: error
          retention-days: 7

      - name: Assemble Hostinger release bundle
        if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          mkdir -p hostinger-release/build hostinger-release/config hostinger-release/app/Console/Commands hostinger-release/app/Http/Controllers/Admin hostinger-release/app/Http/Controllers hostinger-release/app/Http/Middleware hostinger-release/app/Services hostinger-release/app/Mail hostinger-release/app/Models hostinger-release/resources/views/emails hostinger-release/bootstrap hostinger-release/routes
          cp -a public/build/. hostinger-release/build/
          cp config/services.php hostinger-release/config/services.php
          cp app/Http/Controllers/Admin/WarrantyController.php hostinger-release/app/Http/Controllers/Admin/WarrantyController.php
          cp app/Http/Controllers/CheckoutController.php hostinger-release/app/Http/Controllers/CheckoutController.php
          cp app/Http/Controllers/AuthController.php hostinger-release/app/Http/Controllers/AuthController.php
          cp app/Http/Controllers/EmailVerificationController.php hostinger-release/app/Http/Controllers/EmailVerificationController.php
          cp app/Http/Controllers/NotificationController.php hostinger-release/app/Http/Controllers/NotificationController.php
          cp app/Http/Controllers/LandingController.php hostinger-release/app/Http/Controllers/LandingController.php
          cp app/Http/Controllers/ProductController.php hostinger-release/app/Http/Controllers/ProductController.php
          cp app/Http/Controllers/PackageController.php hostinger-release/app/Http/Controllers/PackageController.php
          cp app/Http/Controllers/PurchaseController.php hostinger-release/app/Http/Controllers/PurchaseController.php
          cp app/Http/Controllers/ReviewController.php hostinger-release/app/Http/Controllers/ReviewController.php
          cp app/Console/Commands/ClearProductPackageReferences.php hostinger-release/app/Console/Commands/ClearProductPackageReferences.php
          cp app/Http/Controllers/ChatbotController.php hostinger-release/app/Http/Controllers/ChatbotController.php
          cp app/Services/EmailVerificationCodeService.php hostinger-release/app/Services/EmailVerificationCodeService.php
          cp app/Mail/EmailVerificationCodeMail.php hostinger-release/app/Mail/EmailVerificationCodeMail.php
          cp app/Models/User.php hostinger-release/app/Models/User.php
          cp resources/views/emails/email-verification-code.blade.php hostinger-release/resources/views/emails/email-verification-code.blade.php
          cp app/Http/Middleware/EnforceSingleLoginSession.php hostinger-release/app/Http/Middleware/EnforceSingleLoginSession.php
          cp app/Http/Middleware/HandleInertiaRequests.php hostinger-release/app/Http/Middleware/HandleInertiaRequests.php
          cp app/Services/SingleLoginSessionService.php hostinger-release/app/Services/SingleLoginSessionService.php
          cp bootstrap/app.php hostinger-release/bootstrap/app.php
          cp routes/web.php hostinger-release/routes/web.php

      - name: Upload complete Hostinger release bundle
        if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: secureview-hostinger-release-${{ github.sha }}
          path: hostinger-release/
          if-no-files-found: error
          retention-days: 7
