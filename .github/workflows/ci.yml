name: CI

on:
  push:
    branches:
      - dev
      - feature/google-maps-service-locations
      - feature/scheduling-reschedule-warranty
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Report npm audit details (informational)
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const summary = audit.metadata?.vulnerabilities ?? {};
          console.log('npm audit summary:', JSON.stringify(summary));
          for (const [name, vuln] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(
              `PACKAGE: ${name} | SEVERITY: ${vuln.severity} | DIRECT: ${vuln.isDirect} | RANGE: ${vuln.range} | FIX: ${JSON.stringify(vuln.fixAvailable)}`
            );
            for (const issue of vuln.via ?? []) {
              if (typeof issue === 'object') {
                console.log(`  ADVISORY: ${issue.title} | ${issue.url} | RANGE: ${issue.range}`);
              }
            }
          }
          NODE

      - name: Build Vite assets
        run: npm run build

      - name: Run Laravel feature and unit tests
        run: |
          # Laravel's env bootstrap reads the root .env on each test app boot.
          # CI injects its configuration as environment variables, so an empty file is sufficient.
          touch .env
          php artisan test

      - name: Upload production Vite assets for Hostinger
        if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: secureview-hostinger-vite-${{ github.sha }}
          path: public/build/
          if-no-files-found: error
          retention-days: 7

      - name: Assemble Hostinger release bundle
        if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          mkdir -p hostinger-release/build hostinger-release/config hostinger-release/app/Console/Commands hostinger-release/app/Http/Controllers/Admin hostinger-release/app/Http/Controllers hostinger-release/app/Http/Middleware hostinger-release/app/Services hostinger-release/app/Mail hostinger-release/app/Models hostinger-release/database/migrations hostinger-release/database/seeders hostinger-release/resources/views/emails hostinger-release/resources/views/errors hostinger-release/bootstrap hostinger-release/routes
          cp -a public/build/. hostinger-release/build/
          cp config/services.php hostinger-release/config/services.php
          cp config/filesystems.php hostinger-release/config/filesystems.php
          cp config/app.php hostinger-release/config/app.php
          cp app/Http/Controllers/Admin/WarrantyController.php hostinger-release/app/Http/Controllers/Admin/WarrantyController.php
          cp app/Http/Controllers/Admin/InventoryAdjustmentController.php hostinger-release/app/Http/Controllers/Admin/InventoryAdjustmentController.php
          cp app/Http/Controllers/Admin/UserController.php hostinger-release/app/Http/Controllers/Admin/UserController.php
          cp app/Http/Controllers/Admin/ProductController.php hostinger-release/app/Http/Controllers/Admin/ProductController.php
          cp app/Http/Controllers/Admin/PackageController.php hostinger-release/app/Http/Controllers/Admin/PackageController.php
          cp app/Http/Controllers/Admin/DashboardController.php hostinger-release/app/Http/Controllers/Admin/DashboardController.php
          cp app/Http/Controllers/Admin/ActivityLogController.php hostinger-release/app/Http/Controllers/Admin/ActivityLogController.php
          cp app/Http/Controllers/Admin/PurchaseController.php hostinger-release/app/Http/Controllers/Admin/PurchaseController.php
          cp app/Http/Controllers/Admin/VoucherController.php hostinger-release/app/Http/Controllers/Admin/VoucherController.php
          cp app/Http/Controllers/Admin/ScheduleController.php hostinger-release/app/Http/Controllers/Admin/ScheduleController.php
          cp app/Http/Controllers/Admin/InquiryController.php hostinger-release/app/Http/Controllers/Admin/InquiryController.php
          cp app/Http/Controllers/CheckoutController.php hostinger-release/app/Http/Controllers/CheckoutController.php
          cp app/Http/Controllers/CartController.php hostinger-release/app/Http/Controllers/CartController.php
          cp app/Http/Controllers/PayMongoWebhookController.php hostinger-release/app/Http/Controllers/PayMongoWebhookController.php
          cp app/Http/Controllers/InquiryController.php hostinger-release/app/Http/Controllers/InquiryController.php
          cp app/Http/Controllers/AuthController.php hostinger-release/app/Http/Controllers/AuthController.php
          cp app/Http/Controllers/EmailVerificationController.php hostinger-release/app/Http/Controllers/EmailVerificationController.php
          cp app/Http/Controllers/NotificationController.php hostinger-release/app/Http/Controllers/NotificationController.php
          cp app/Http/Controllers/LandingController.php hostinger-release/app/Http/Controllers/LandingController.php
          cp app/Http/Controllers/ProductController.php hostinger-release/app/Http/Controllers/ProductController.php
          cp app/Http/Controllers/PackageController.php hostinger-release/app/Http/Controllers/PackageController.php
          cp app/Http/Controllers/TechnicianWorkspaceController.php hostinger-release/app/Http/Controllers/TechnicianWorkspaceController.php
          cp app/Http/Controllers/PurchaseController.php hostinger-release/app/Http/Controllers/PurchaseController.php
          cp app/Http/Controllers/ReviewController.php hostinger-release/app/Http/Controllers/ReviewController.php
          cp app/Http/Controllers/ReviewController.php hostinger-release/app/Http/Controllers/ReviewController.php
          cp app/Http/Controllers/ReviewController.php hostinger-release/app/Http/Controllers/ReviewController.php
          cp app/Console/Commands/ClearProductPackageReferences.php hostinger-release/app/Console/Commands/ClearProductPackageReferences.php
          cp app/Http/Controllers/ChatbotController.php hostinger-release/app/Http/Controllers/ChatbotController.php
          cp app/Services/EmailVerificationCodeService.php hostinger-release/app/Services/EmailVerificationCodeService.php
          cp app/Mail/EmailVerificationCodeMail.php hostinger-release/app/Mail/EmailVerificationCodeMail.php
          cp app/Models/User.php hostinger-release/app/Models/User.php
          cp app/Models/Order.php hostinger-release/app/Models/Order.php
          cp app/Models/Voucher.php hostinger-release/app/Models/Voucher.php
          cp app/Models/PendingInquiryCheckout.php hostinger-release/app/Models/PendingInquiryCheckout.php
          cp app/Models/Product.php hostinger-release/app/Models/Product.php
          cp app/Models/Package.php hostinger-release/app/Models/Package.php
          cp app/Models/Inquiry.php hostinger-release/app/Models/Inquiry.php
          cp app/Models/ServiceBookingFeeSetting.php hostinger-release/app/Models/ServiceBookingFeeSetting.php
          cp app/Models/ServiceRecord.php hostinger-release/app/Models/ServiceRecord.php
          cp app/Models/ServiceRecordItem.php hostinger-release/app/Models/ServiceRecordItem.php
          cp app/Models/Review.php hostinger-release/app/Models/Review.php
          cp app/Models/Review.php hostinger-release/app/Models/Review.php
          cp app/Http/Controllers/Admin/CatalogOptionController.php hostinger-release/app/Http/Controllers/Admin/CatalogOptionController.php
          cp database/migrations/2026_10_23_200000_add_brand_to_products_and_packages_table.php hostinger-release/database/migrations/2026_10_23_200000_add_brand_to_products_and_packages_table.php
          cp database/migrations/2026_10_23_210000_backfill_explicit_catalog_brands.php hostinger-release/database/migrations/2026_10_23_210000_backfill_explicit_catalog_brands.php
          cp database/seeders/CatalogExpansionSeeder.php hostinger-release/database/seeders/CatalogExpansionSeeder.php
          cp resources/views/app.blade.php hostinger-release/resources/views/app.blade.php
          cp resources/views/errors/404.blade.php hostinger-release/resources/views/errors/404.blade.php
          cp resources/views/emails/email-verification-code.blade.php hostinger-release/resources/views/emails/email-verification-code.blade.php
          cp app/Http/Middleware/EnforceSingleLoginSession.php hostinger-release/app/Http/Middleware/EnforceSingleLoginSession.php
          cp app/Http/Middleware/HandleInertiaRequests.php hostinger-release/app/Http/Middleware/HandleInertiaRequests.php
          cp app/Services/SingleLoginSessionService.php hostinger-release/app/Services/SingleLoginSessionService.php
          cp app/Services/InventoryService.php hostinger-release/app/Services/InventoryService.php
          cp app/Services/InvoiceDocumentService.php hostinger-release/app/Services/InvoiceDocumentService.php
          cp app/Services/VoucherService.php hostinger-release/app/Services/VoucherService.php
          cp app/Services/PayMongoLineItemBuilder.php hostinger-release/app/Services/PayMongoLineItemBuilder.php
          cp app/Services/JobNotificationService.php hostinger-release/app/Services/JobNotificationService.php
          cp app/Services/PendingInquiryCheckoutService.php hostinger-release/app/Services/PendingInquiryCheckoutService.php
          cp app/Services/OrderCancellationService.php hostinger-release/app/Services/OrderCancellationService.php
          cp app/Services/OrderNotificationService.php hostinger-release/app/Services/OrderNotificationService.php
          cp routes/console.php hostinger-release/routes/console.php
          cp database/migrations/2026_10_23_230000_create_service_records_tables.php hostinger-release/database/migrations/2026_10_23_230000_create_service_records_tables.php
          cp database/migrations/2026_10_24_010000_sync_cancelled_order_payment_status.php hostinger-release/database/migrations/2026_10_24_010000_sync_cancelled_order_payment_status.php
          cp database/migrations/2026_10_25_060000_add_booking_priority_fees_to_orders_and_inquiries.php hostinger-release/database/migrations/2026_10_25_060000_add_booking_priority_fees_to_orders_and_inquiries.php
          cp database/migrations/2026_10_25_070000_create_service_booking_fee_settings_table.php hostinger-release/database/migrations/2026_10_25_070000_create_service_booking_fee_settings_table.php
          cp database/migrations/2026_10_27_000001_create_vouchers_and_add_order_discounts.php hostinger-release/database/migrations/2026_10_27_000001_create_vouchers_and_add_order_discounts.php
          cp database/migrations/2026_10_27_000002_change_voucher_schedule_fields_to_local_datetime.php hostinger-release/database/migrations/2026_10_27_000002_change_voucher_schedule_fields_to_local_datetime.php
          cp database/migrations/2026_10_28_000001_add_promo_sales_to_products_and_packages.php hostinger-release/database/migrations/2026_10_28_000001_add_promo_sales_to_products_and_packages.php
          cp database/migrations/2026_10_24_220000_add_images_to_reviews_table.php hostinger-release/database/migrations/2026_10_24_220000_add_images_to_reviews_table.php
          cp database/migrations/2026_10_24_220000_add_images_to_reviews_table.php hostinger-release/database/migrations/2026_10_24_220000_add_images_to_reviews_table.php
          cp bootstrap/app.php hostinger-release/bootstrap/app.php
          cp routes/web.php hostinger-release/routes/web.php

      - name: Upload complete Hostinger release bundle
        if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: secureview-hostinger-release-${{ github.sha }}
          path: hostinger-release/
          if-no-files-found: error
          retention-days: 7

      - name: Package Hostinger release ZIP and SHA-256
        if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          ZIP_NAME="secureview-hostinger-release-${GITHUB_SHA}.zip"
          (cd hostinger-release && zip -qr "../${ZIP_NAME}" .)
          cp scripts/deploy-hostinger-release.sh ./deploy-hostinger-release.sh
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          sha256sum --check "${ZIP_NAME}.sha256"
          unzip -t "${ZIP_NAME}" | tail -n 2

      - name: Upload ready-to-deploy Hostinger package
        if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: secureview-hostinger-release-zip-${{ github.sha }}
          path: |
            secureview-hostinger-release-${{ github.sha }}.zip
            secureview-hostinger-release-${{ github.sha }}.zip.sha256
            deploy-hostinger-release.sh
          if-no-files-found: error
          retention-days: 7
